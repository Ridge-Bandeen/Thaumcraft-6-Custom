// not compile against NeoForge 1.21.1. Rather than moving it out of the tree, we compile it
// in-place, package by package: only files listed here are actually built. Add a file/package
// to this list once it has been converted to the NeoForge 1.21.1 APIs.
// --------------------------------------------------------------------------------------------

# Thaumcraft's own access transformer - see TileBellows' own doc comment for why this exists: it needs to
# read/nudge a vanilla furnace's cooking progress, and both fields are package-private in modern Minecraft
# (they were public in 1.12.2's TileEntityFurnace). Syntax/style matches NeoForge's own accesstransformer.cfg
# (bundled in its userdev artifact) - <access> <fully.qualified.ClassName> <fieldName> # <comment>, no field
# descriptor needed (only methods need one).
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingProgress # cookingProgress
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity cookingTotalTime # cookingTotalTime
